name: simulation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The suites are split over four parallel jobs (each on its own runner, tests in parallel inside
  # the job with pytest-xdist, one GHDL simulation per core). One GHDL simulation of the longest
  # test (test_system_level, real 1024-clock frames) takes ~25 min on one core, so every job
  # keeps a wide margin below its timeout. Together the jobs select every test of test_runner.py
  # exactly once (sim/cocotb/README.md, "CI").
  cocotb-ghdl:
    name: cocotb-ghdl (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: system
            k: "test_system"
          - name: chain
            k: "test_fx_chain or test_trem or test_timing_invariance or test_cab_xfade or test_dyn_eq_xfade or test_xfade"
          - name: reference-wav
            k: "test_refv2 or test_wav"
          - name: blocks
            k: "test_dynamics or test_eq3 or test_reverbfv or test_cabfir or test_moddelay or test_lfo or test_fxlib or test_smooth or test_i2s or test_avmm or test_codec"
    steps:
      - uses: actions/checkout@v4

      - name: Install GHDL
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl make g++
          ghdl --version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cocotb
        run: pip install "cocotb~=2.0" numpy pytest pytest-xdist

      - name: Check generated IP models are up to date
        if: matrix.name == 'blocks'
        run: |
          python sim/models/gen_ip_models.py
          git diff --exit-code sim/models/ip

      - name: Tests (${{ matrix.name }})
        working-directory: sim/cocotb
        env:
          GME_WAV_SECONDS: "0.25"
        run: pytest -v -n auto --dist load --durations=10 -k "${{ matrix.k }}"

      - name: Upload processed audio
        if: always() && matrix.name == 'reference-wav'
        uses: actions/upload-artifact@v4
        with:
          name: wav-outputs
          path: sim/out/cocotb_wav/*.wav
          if-no-files-found: ignore
