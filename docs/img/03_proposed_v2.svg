<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img">
<title>Proposed v2 architecture</title>
<desc>Phone or browser and a USB MIDI pedal connect to a Linux control app on the HPS ARM Cortex-A9. The control app writes control and status registers in the FPGA over the AXI bridge. The FPGA runs one clock domain with a 48 kHz strobe: I2S RX/TX to the codec, a reorderable Avalon-ST effect engine, interpolated delay memory in M10K, and DDR3 access for a looper and cabinet impulse responses.</desc>
<defs>
<style>
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#3d3d3a}.ts{font-size:12px;fill:#73726c}.th{font-size:14px;font-weight:600;fill:#2c2c2a}
.box{fill:#ffffff;stroke:#b4b2a9}.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="430" fill="#ffffff"/>
<g class="c-gray"><rect x="40" y="70" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="105" y="88" text-anchor="middle" dominant-baseline="central">Phone / browser</text><text class="ts" x="105" y="108" text-anchor="middle" dominant-baseline="central">web UI, Wi-Fi</text></g>
<g class="c-gray"><rect x="40" y="140" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="105" y="158" text-anchor="middle" dominant-baseline="central">MIDI pedal</text><text class="ts" x="105" y="178" text-anchor="middle" dominant-baseline="central">USB footswitch</text></g>
<g class="c-gray"><rect x="40" y="320" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="105" y="338" text-anchor="middle" dominant-baseline="central">Audio codec</text><text class="ts" x="105" y="358" text-anchor="middle" dominant-baseline="central">guitar in, amp out</text></g>
<g class="c-purple"><rect x="210" y="40" width="430" height="110" rx="12" stroke-width="0.5"/><text class="th" x="230" y="56" dominant-baseline="central">HPS: dual ARM Cortex-A9, Linux</text></g>
<rect class="box" x="230" y="70" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="320" y="88" text-anchor="middle" dominant-baseline="central">Control app</text><text class="ts" x="320" y="108" text-anchor="middle" dominant-baseline="central">presets, MIDI, meters</text>
<rect class="box" x="430" y="70" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="525" y="88" text-anchor="middle" dominant-baseline="central">DDR3, 1 GB</text><text class="ts" x="525" y="108" text-anchor="middle" dominant-baseline="central">looper, cab IRs</text>
<g class="c-teal"><rect x="210" y="190" width="430" height="210" rx="12" stroke-width="0.5"/><text class="th" x="230" y="206" dominant-baseline="central">FPGA: one clock + 48 kHz strobe</text></g>
<rect class="box" x="230" y="230" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="320" y="248" text-anchor="middle" dominant-baseline="central">Control/status regs</text><text class="ts" x="320" y="268" text-anchor="middle" dominant-baseline="central">readback, levels</text>
<rect class="box" x="430" y="230" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="525" y="248" text-anchor="middle" dominant-baseline="central">Effect engine</text><text class="ts" x="525" y="268" text-anchor="middle" dominant-baseline="central">Avalon-ST, reorderable</text>
<rect class="box" x="230" y="320" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="320" y="338" text-anchor="middle" dominant-baseline="central">I2S RX / TX</text><text class="ts" x="320" y="358" text-anchor="middle" dominant-baseline="central">stereo, 24-bit</text>
<rect class="box" x="430" y="320" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="525" y="338" text-anchor="middle" dominant-baseline="central">Delay memory</text><text class="ts" x="525" y="358" text-anchor="middle" dominant-baseline="central">M10K, interpolated</text>
<line x1="170" y1="98" x2="228" y2="98" class="arr" marker-end="url(#arrow)"/>
<path d="M170 168 L196 168 L196 112 L228 112" class="arr" marker-end="url(#arrow)"/>
<line x1="300" y1="126" x2="300" y2="228" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="310" y="170" dominant-baseline="central">AXI bridge</text>
<line x1="525" y1="128" x2="525" y2="228" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="535" y="170" dominant-baseline="central">SDRAM port</text>
<line x1="410" y1="250" x2="428" y2="250" class="arr" marker-end="url(#arrow)"/>
<path d="M412 340 L420 340 L420 272 L428 272" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="525" y1="288" x2="525" y2="318" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="172" y1="348" x2="228" y2="348" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</svg>
