<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img">
<title>Current audio datapath and clock domains</title>
<desc>ADC controller and FIFO in the BCLK domain feed overdrive and distortion clocked on the LRCLK rising edge, then chorus, tremolo, echo and reverb on the LRCLK falling edge, then the DAC controller in the BCLK domain.</desc>
<defs>
<style>
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#3d3d3a}.ts{font-size:12px;fill:#73726c}.th{font-size:14px;font-weight:600;fill:#2c2c2a}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="330" fill="#ffffff"/>
<g class="c-gray"><rect x="50" y="60" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="115" y="78" text-anchor="middle" dominant-baseline="central">ADC ctrl</text><text class="ts" x="115" y="98" text-anchor="middle" dominant-baseline="central">I2S in, BCLK</text></g>
<g class="c-gray"><rect x="200" y="60" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="265" y="78" text-anchor="middle" dominant-baseline="central">FIFO</text><text class="ts" x="265" y="98" text-anchor="middle" dominant-baseline="central">BCLK → LRCLK</text></g>
<g class="c-teal"><rect x="350" y="60" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="415" y="78" text-anchor="middle" dominant-baseline="central">Overdrive</text><text class="ts" x="415" y="98" text-anchor="middle" dominant-baseline="central">clip x gain</text></g>
<g class="c-teal"><rect x="500" y="60" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="565" y="78" text-anchor="middle" dominant-baseline="central">Distortion</text><text class="ts" x="565" y="98" text-anchor="middle" dominant-baseline="central">ROM curves</text></g>
<line x1="180" y1="88" x2="198" y2="88" class="arr" marker-end="url(#arrow)"/>
<line x1="330" y1="88" x2="348" y2="88" class="arr" marker-end="url(#arrow)"/>
<line x1="480" y1="88" x2="498" y2="88" class="arr" marker-end="url(#arrow)"/>
<path d="M565 116 L565 152 L100 152 L100 188" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="48" y="190" width="104" height="56" rx="8" stroke-width="0.5"/><text class="th" x="100" y="208" text-anchor="middle" dominant-baseline="central">Chorus</text><text class="ts" x="100" y="228" text-anchor="middle" dominant-baseline="central">1K RAM delay</text></g>
<g class="c-purple"><rect x="168" y="190" width="104" height="56" rx="8" stroke-width="0.5"/><text class="th" x="220" y="208" text-anchor="middle" dominant-baseline="central">Tremolo</text><text class="ts" x="220" y="228" text-anchor="middle" dominant-baseline="central">8 LFO ROMs</text></g>
<g class="c-purple"><rect x="288" y="190" width="104" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="208" text-anchor="middle" dominant-baseline="central">Echo</text><text class="ts" x="340" y="228" text-anchor="middle" dominant-baseline="central">64K RAM</text></g>
<g class="c-purple"><rect x="408" y="190" width="104" height="56" rx="8" stroke-width="0.5"/><text class="th" x="460" y="208" text-anchor="middle" dominant-baseline="central">Reverb</text><text class="ts" x="460" y="228" text-anchor="middle" dominant-baseline="central">4 comb, 2 AP</text></g>
<g class="c-gray"><rect x="528" y="190" width="104" height="56" rx="8" stroke-width="0.5"/><text class="th" x="580" y="208" text-anchor="middle" dominant-baseline="central">DAC ctrl</text><text class="ts" x="580" y="228" text-anchor="middle" dominant-baseline="central">I2S out, BCLK</text></g>
<line x1="152" y1="218" x2="166" y2="218" class="arr" marker-end="url(#arrow)"/>
<line x1="272" y1="218" x2="286" y2="218" class="arr" marker-end="url(#arrow)"/>
<line x1="392" y1="218" x2="406" y2="218" class="arr" marker-end="url(#arrow)"/>
<line x1="512" y1="218" x2="526" y2="218" class="arr" marker-end="url(#arrow)"/>
<rect class="c-gray" x="40" y="273" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="60" y="280" dominant-baseline="central">BCLK domain (4.6 MHz)</text>
<rect class="c-teal" x="230" y="273" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="250" y="280" dominant-baseline="central">LRCLK rising edge</text>
<rect class="c-purple" x="400" y="273" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="420" y="280" dominant-baseline="central">LRCLK falling edge</text>
<text class="ts" x="40" y="306" dominant-baseline="central">16-bit mono samples; parameters cross from 50 MHz unsynchronised</text>
</svg>
