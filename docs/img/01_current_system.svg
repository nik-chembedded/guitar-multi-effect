<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img">
<title>Current system block diagram</title>
<desc>PC GUI connects over UART to a Nios II/e system inside the Cyclone V FPGA. The Nios II reaches UART, I2C PIO, SDRAM controller and RegistersControl over Avalon-MM. RegistersControl drives 15 16-bit parameters into the VHDL audio datapath, which exchanges I2S audio with the WM8731 codec. The I2C PIOs configure the codec.</desc>
<defs>
<style>
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#3d3d3a}.ts{font-size:12px;fill:#73726c}.th{font-size:14px;font-weight:600;fill:#2c2c2a}
.box{fill:#ffffff;stroke:#b4b2a9}.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="470" fill="#ffffff"/>
<rect x="210" y="30" width="430" height="400" rx="20" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="230" y="52" dominant-baseline="central">Cyclone V FPGA (DE1-SoC)</text>
<g class="c-purple"><rect x="230" y="70" width="390" height="230" rx="12" stroke-width="0.5"/><text class="th" x="250" y="84" dominant-baseline="central">Platform Designer system</text></g>
<rect class="box" x="250" y="110" width="120" height="150" rx="8" stroke-width="0.5"/><text class="th" x="310" y="168" text-anchor="middle" dominant-baseline="central">Nios II/e</text><text class="ts" x="310" y="188" text-anchor="middle" dominant-baseline="central">50 MHz CPU</text><text class="ts" x="310" y="206" text-anchor="middle" dominant-baseline="central">code in SDRAM</text>
<rect class="box" x="390" y="110" width="20" height="150" rx="4" stroke-width="0.5"/>
<text class="ts" x="400" y="280" text-anchor="middle" dominant-baseline="central">Avalon-MM 32b</text>
<line x1="370" y1="185" x2="390" y2="185" stroke="#73726c" stroke-width="1.5"/>
<rect class="box" x="430" y="110" width="170" height="32" rx="6" stroke-width="0.5"/><text class="t" x="515" y="126" text-anchor="middle" dominant-baseline="central">UART</text>
<rect class="box" x="430" y="150" width="170" height="32" rx="6" stroke-width="0.5"/><text class="t" x="515" y="166" text-anchor="middle" dominant-baseline="central">I2C PIO x2</text>
<rect class="box" x="430" y="190" width="170" height="32" rx="6" stroke-width="0.5"/><text class="t" x="515" y="206" text-anchor="middle" dominant-baseline="central">SDRAM controller</text>
<rect class="box" x="430" y="230" width="170" height="32" rx="6" stroke-width="0.5"/><text class="t" x="515" y="246" text-anchor="middle" dominant-baseline="central">RegistersControl</text>
<line x1="410" y1="126" x2="428" y2="126" class="arr" marker-end="url(#arrow)"/>
<line x1="410" y1="166" x2="428" y2="166" class="arr" marker-end="url(#arrow)"/>
<line x1="410" y1="206" x2="428" y2="206" class="arr" marker-end="url(#arrow)"/>
<line x1="410" y1="246" x2="428" y2="246" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="70" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="115" y="88" text-anchor="middle" dominant-baseline="central">PC GUI</text><text class="ts" x="115" y="108" text-anchor="middle" dominant-baseline="central">C#, UART 9600 baud</text></g>
<path d="M190 98 L420 98 L420 126 L428 126" class="arr" marker-end="url(#arrow)"/>
<line x1="515" y1="262" x2="515" y2="318" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="505" y="310" text-anchor="end" dominant-baseline="central">15 x 16-bit params</text>
<g class="c-teal"><rect x="230" y="320" width="390" height="90" rx="12" stroke-width="0.5"/><text class="th" x="425" y="345" text-anchor="middle" dominant-baseline="central">Audio datapath (VHDL)</text><text class="ts" x="425" y="365" text-anchor="middle" dominant-baseline="central">ADC → FIFO → 6 effects → DAC</text><text class="ts" x="425" y="385" text-anchor="middle" dominant-baseline="central">clocked by codec LRCLK, 48 kHz</text></g>
<g class="c-gray"><rect x="40" y="330" width="150" height="70" rx="8" stroke-width="0.5"/><text class="th" x="115" y="350" text-anchor="middle" dominant-baseline="central">Audio codec</text><text class="ts" x="115" y="368" text-anchor="middle" dominant-baseline="central">WM8731</text><text class="ts" x="115" y="386" text-anchor="middle" dominant-baseline="central">line in / line out</text></g>
<line x1="190" y1="350" x2="228" y2="350" class="arr" marker-end="url(#arrow)"/>
<line x1="230" y1="385" x2="192" y2="385" class="arr" marker-end="url(#arrow)"/>
<path d="M600 166 L628 166 L628 418 L115 418 L115 402" fill="none" stroke="#73726c" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="40" y="452" dominant-baseline="central">Solid: data / bus (I2S audio, Avalon-MM, UART)   Dashed: I2C codec configuration</text>
</svg>
